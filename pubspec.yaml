name: heshab_book_app
description: "Heshab Book — Offline-first business accounting, billing, stock & ledger app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Database — Drift (SQLite ORM)
  drift: ^2.26.1
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.30

  # Routing
  go_router: ^15.1.2

  # Dependency Injection
  get_it: ^8.0.3

  # Model Generation
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Unique IDs
  uuid: ^4.5.1

  # Local Key-Value Storage (for auth state, settings)
  hive_flutter: ^1.1.0

  # HTTP Client (for future sync)
  dio: ^5.8.0+1

  # Logging
  logger: ^2.5.0

  # Date/Number Formatting
  intl: ^0.20.2

  # Typography
  google_fonts: ^6.2.1

  # Responsive UI
  flutter_screenutil: ^5.9.3

  # Password Hashing (local auth)
  crypto: ^3.0.6

  # Path utilities
  path_provider: ^2.1.5
  path: ^1.9.1
  fl_chart: ^1.2.0
  flutter_animate: ^4.5.2
  googleapis: ^16.0.0
  googleapis_auth: ^2.3.0
  google_sign_in: ^7.2.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.3
  drift_dev: ^2.26.1
  freezed: ^2.5.8
  json_serializable: ^6.9.5

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/icons/
    - assets/translations/
