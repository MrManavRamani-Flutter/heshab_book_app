name: heshab_book_app
description: "A proper and simple UI for Kapad Shop Management."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Database (SQLite)
  drift: ^2.26.1
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.42
  path_provider: ^2.1.5
  path: ^1.9.1

  # Routing
  go_router: ^15.1.2

  # Utils
  intl: ^0.20.2
  google_fonts: ^6.2.1
  shared_preferences: ^2.5.5
  translator: ^1.0.4+1
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.4
  drift_dev: ^2.26.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#8B0000" # Khata Red
  image: "assets/icon.png"
  android: true
  ios: true
  android_12:
    image: "assets/icon.png"
    icon_background_color: "#8B0000"
    color: "#8B0000"
